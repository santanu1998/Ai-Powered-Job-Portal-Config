server:
  port: 5002
spring:
  jpa:
    hibernate:
      # Disable automatic schema updates to avoid Hibernate-generated DDL during manual migrations.
      # Change to 'validate' or 'update' only after the DB schema has been migrated to match the entities.
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/job_portal_company
    username: postgres
    password: SanuSwastika@1819
    driver-class-name: org.postgresql.Driver
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true